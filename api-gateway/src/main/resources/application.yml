server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-iam-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: appointments-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/appointments/**

            - id: profile-medical-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/profiles/**, /api/v1/medical-records/**, /api/v1/consents/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                maxAge: 3600