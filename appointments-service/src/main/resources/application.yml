server:
  port: 8083

spring:
  application:
    name: appointments-service
  datasource:
    url: jdbc:postgresql://localhost:5434/appointments_db
    username: postgres
    password: secretPassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect