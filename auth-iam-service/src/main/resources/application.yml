server:
  port: 8081

spring:
  application:
    name: auth-iam-service

  datasource:
    url: jdbc:postgresql://localhost:5434/auth_db
    username: postgres
    password: secretPassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

